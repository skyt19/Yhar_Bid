<!DOCTYPE html>
<html>
<head>
  <!--
    Important: This placeholder will be replaced by Flutter build with --base-href value
    Do not remove this line!
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yharbid - AI-Powered Personal Assistant for Students, Employees & Educators">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yharbid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yharbid AI Assistant</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-In for Web (Async Load for Performance) -->
  <meta name="google-signin-client_id" content="197558461101-fpvs52hlfg76po4c5bmufqotpr962hf6.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    /* Loading Screen to prevent FOUC (Flash of Unstyled Content) */
    body {
      margin: 0;
      padding: 0;
      background-color: #CFD8DC;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #CFD8DC;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    #loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(117, 117, 117, 0.3);
      border-top-color: #4CAF50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div id="loading-spinner"></div>
  </div>

  <!-- Flutter Bootstrap (Main Entry Point) -->
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Remove loading screen when Flutter app loads
    window.addEventListener('flutter-first-frame', function() {
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.style.display = 'none';
      }
    });
    
    // Fallback: remove loading screen after 10 seconds
    setTimeout(function() {
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.style.display = 'none';
      }
    }, 10000);
  </script>
</body>
</html>
